# PP4 — DSFold + learned hard-concrete gates (pp4-dsfold-gate/).
method: pp4_gate
factory: token_reduction_vl.pruning.pp4_gate.factory:build_pruner
dsfold_params: configs/dsfold_D-1.0.yaml
min_ratio: 0.0555555556      # K_min = ceil(N / 18), level L1

model:
  id: Qwen/Qwen3-VL-2B-Instruct
  dtype: auto
  device_map: auto
  attn_implementation: sdpa  # switch to eager if the spike fails with sdpa
  max_new_tokens: 32

teacher:
  split: configs/splits/gqa_train_50k.txt
  canonical: data/processed/v1/gqa/train.jsonl
  output: data/features/pp4_gate/teacher_gqa_train_50k.npz
  top_k: 64

training:
  lambdas: [0.25, 0.5, 1.0, 2.0, 4.0]
  eta: 0.1
  mu: 0.0
  epochs: 2
  lr: 1.0e-4
  grad_accumulation: 8
  eps: 1.0e-4
  anchor_level: L3
  seed: 0
  pilot_samples: 5000        # step 5 of the PP4 README
  output_dir: outputs/pp4_gate

# Set after training; used by scripts/common/run_pruned.py.
checkpoint: outputs/pp4_gate/checkpoints/gate_lambda1.0.pt
