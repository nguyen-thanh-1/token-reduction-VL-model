seed: 42

model:
  id: Qwen/Qwen3-VL-2B-Instruct
  dtype: auto
  device_map: auto
  attn_implementation: null
  trust_remote_code: false
  max_new_tokens: 32
  do_sample: false

run:
  default_dataset: mme_test
  output_dir: outputs/baseline
  limit: null

data:
  sources:
    mme_test:
      kind: canonical
      path: data/processed/v1/mme/test.jsonl

    mmb_validation:
      kind: canonical
      path: data/processed/v1/mmbench/validation.jsonl

    mmb_test:
      kind: canonical
      path: data/processed/v1/mmbench/test.jsonl

    gqa_val_balanced:
      kind: canonical
      path: data/processed/v1/gqa/val.jsonl

    gqa_testdev_balanced:
      kind: canonical
      path: data/processed/v1/gqa/testdev.jsonl

    # ADR 0006: evaluation-only benchmarks.
    pope_test:
      kind: canonical
      path: data/processed/v1/pope/test.jsonl

    sqa_img_test:
      kind: canonical
      path: data/processed/v1/scienceqa/img_test.jsonl
