[project]
name = "token-reduction-vl-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "torch>=2.6.0",
    "tqdm>=4.66.0",
    "transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
